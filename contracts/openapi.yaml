  "components": {
    "securitySchemes": {
      "cookieAuth": {
        "type": "apiKey",
        "in": "cookie",
        "name": "JSESSIONID",
        "description": "서버 세션 쿠키. HttpOnly/SameSite, HTTPS Secure. 브라우저 JS에 세션 값을 보관하지 않는다."
      }
    },
    "schemas": {
      "User": {
        "type": "object",
        "required": [
          "id",
          "email",
          "nickname"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "email": {
            "type": "string",
            "format": "email"
          },
          "nickname": {
            "type": "string",
            "maxLength": 12
          }
        }
      },
      "PublicUser": {
        "type": "object",
        "required": [
          "id",
          "nickname"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "nickname": {
            "type": "string",
            "maxLength": 12
          }
        }
      },
      "Artist": {
        "type": "object",
        "required": [
          "id",
          "name",
          "genre",
          "art"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "genre": {
            "type": "string"
          },
          "art": {
            "type": "string"
          }
        }
      },
      "Track": {
        "type": "object",
        "required": [
          "id",
          "title",
          "artist",
          "art",
          "length"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "artist": {
            "type": "string"
          },
          "art": {
            "type": "string"
          },
          "length": {
            "type": "string"
          }
        }
      },
      "Taste": {
        "type": "object",
        "required": [
          "artists",
          "tracks",
          "genres",
          "moods",
          "public"
        ],
        "properties": {
          "artists": {
            "type": "array",
            "uniqueItems": true,
            "maxItems": 5,
            "items": {
              "type": "string"
            }
          },
          "tracks": {
            "type": "array",
            "uniqueItems": true,
            "maxItems": 10,
            "items": {
              "type": "string"
            }
          },
          "genres": {
            "type": "array",
            "uniqueItems": true,
            "maxItems": 3,
            "items": {
              "type": "string"
            }
          },
          "moods": {
            "type": "array",
            "uniqueItems": true,
            "maxItems": 3,
            "items": {
              "type": "string"
            }
          },
          "public": {
            "type": "boolean"
          }
        }
      },
      "Profile": {
        "type": "object",
        "required": [
          "user",
          "taste",
          "complete",
          "analysis"
        ],
        "properties": {
          "user": {
            "$ref": "#/components/schemas/User"
          },
          "taste": {
            "$ref": "#/components/schemas/Taste"
          },
          "complete": {
            "type": "boolean"
          },
          "analysis": {
            "type": "string",
            "enum": [
              "basic",
              "ai"
            ]
          }
        }
      },
      "Catalog": {
        "type": "object",
        "required": [
          "artists",
          "tracks"
        ],
        "properties": {
          "artists": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Artist"
            }
          },
          "tracks": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Track"
            }
          }
        }
      },
      "Match": {
        "type": "object",
        "required": [
          "user",
          "score",
          "commonArtists",
          "commonTracks",
          "newTracks",
          "differentArtists",
          "genres",
          "moods",
          "reason"
        ],
        "properties": {
          "user": {
            "$ref": "#/components/schemas/PublicUser"
          },
          "score": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100
          },
          "commonArtists": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Artist"
            }
          },
          "commonTracks": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Track"
            }
          },
          "newTracks": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Track"
            }
          },
          "differentArtists": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Artist"
            }
          },
          "genres": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "moods": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "reason": {
            "type": "string"
          }
        }
      },
      "Interest": {
        "type": "object",
        "required": [
          "id",
          "senderId",
          "recipientId",
          "senderName",
          "recipientName",
          "note",
          "status",
          "createdAt"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "senderId": {
            "type": "string"
          },
          "recipientId": {
            "type": "string"
          },
          "senderName": {
            "type": "string"
          },
          "recipientName": {
            "type": "string"
          },
          "note": {
            "type": "string",
            "maxLength": 140
          },
          "status": {
            "type": "string",
            "enum": [
              "PENDING",
              "ACCEPTED",
              "REJECTED",
              "CANCELLED"
            ]
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Connection": {
        "type": "object",
        "required": [
          "id",
          "userA",
          "userB",
          "requestId",
          "partner"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "userA": {
            "type": "string"
          },
          "userB": {
            "type": "string"
          },
          "requestId": {
            "type": "string"
          },
          "partner": {
            "$ref": "#/components/schemas/PublicUser"
          }
        }
      },
      "Invitation": {
        "type": "object",
        "required": [
          "token",
          "inviterId",
          "inviterName",
          "recipientId",
          "inviterConsent",
          "recipientConsent",
          "expiresAt",
          "status"
        ],
        "properties": {
          "token": {
            "type": "string"
          },
          "inviterId": {
            "type": "string"
          },
          "inviterName": {
            "type": "string"
          },
          "recipientId": {
            "type": [
              "string",
              "null"
            ]
          },
          "inviterConsent": {
            "type": "boolean"
          },
          "recipientConsent": {
            "type": "boolean"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "status": {
            "type": "string",
            "enum": [
              "WAITING",
              "NEEDS_PROFILE",
              "NEEDS_CONSENT",
              "READY",
              "EXPIRED"
            ]
          }
        }
      },
      "Error": {
        "type": "object",
        "required": [
          "code",
          "message"
        ],
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          }
        }
      },
      "Csrf": {
        "type": "object",
        "required": [
          "token",
          "headerName"
        ],
        "properties": {
          "token": {
            "type": "string"
          },
          "headerName": {
            "type": "string",
            "enum": [
              "X-CSRF-TOKEN",
              "X-XSRF-TOKEN"
            ]
          }
        }
      },
      "Signup": {
        "type": "object",
        "required": [
          "email",
          "nickname",
          "password"
        ],
        "properties": {
          "email": {
            "type": "string",
            "format": "email"
          },
          "nickname": {
            "type": "string",
            "minLength": 1,
            "maxLength": 12
          },
          "password": {
            "type": "string",
            "minLength": 8,
            "writeOnly": true
          }
        }
      },
      "Login": {
        "type": "object",
        "required": [
          "email",
          "password"
        ],
        "properties": {
          "email": {
            "type": "string",
            "format": "email"
          },
          "password": {
            "type": "string",
            "writeOnly": true
          }
        }
      },
      "Consent": {
        "type": "object",
        "required": [
          "consent"
        ],
        "properties": {
          "consent": {
            "type": "boolean",
            "const": true
          }
        }
      },
      "Nickname": {
        "type": "object",
        "required": [
          "nickname"
        ],
        "properties": {
          "nickname": {
            "type": "string",
            "minLength": 1,
            "maxLength": 12
          }
        }
      },
      "NewArtist": {
        "type": "object",
        "required": [
          "name"
        ],
        "properties": {
          "name": {
            "type": "string",
            "maxLength": 80
          }
        }
      },
      "NewTrack": {
        "type": "object",
        "required": [
          "title",
          "artist"
        ],
        "properties": {
          "title": {
            "type": "string",
            "maxLength": 80
          },
          "artist": {
            "type": "string",
            "maxLength": 80
          }
        }
      },
      "SendInterest": {
        "type": "object",
        "required": [
          "recipientId",
          "note"
        ],
        "properties": {
          "recipientId": {
            "type": "string"
          },
          "note": {
            "type": "string",
            "maxLength": 140
          }
        }
      }
    },
    "responses": {
      "Failure": {
        "description": "400 입력/본인 요청, 401 미인증, 403 인가/CSRF/공개·동의, 404 없음, 409 중복/종료 상태, 410 만료, 422 미완료 취향, 500 저장 실패. 원본 데이터 유지.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      }
    }
  }
}
