name: Frontend checks
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  # Add Spring integration tests only after the backend and PostgreSQL fixtures exist.
