spring:
  application:
    name: tunit
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
server:
  port: ${SERVER_PORT:8080}
  address: 127.0.0.1
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
app:
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  ai:
    embedding-enabled: ${AI_EMBEDDING_ENABLED:false}
  # Reserved for later integrations; no AI or external service is enabled here.
  # The API currently supports same-origin session requests only.

server.error:
  include-message: never
  include-stacktrace: never
  include-binding-errors: never
